[package]
name = "pinentry-dispatch"
version = "0.1.0"
edition = "2021"
description = "Route GnuPG pinentry to Touch ID locally and curses over SSH"
license = "MIT"

[[bin]]
name = "pinentry-dispatch"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
security-framework = "3.7.0"
